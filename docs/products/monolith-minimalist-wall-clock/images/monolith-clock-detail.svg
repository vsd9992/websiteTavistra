  <!-- Hands in Raw Aluminum Edition -->
  <line x1="400" y1="330" x2="400" y2="245" stroke="url(#brassGrad2)" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="330" x2="480" y2="350" stroke="url(#brassGrad2)" stroke-width="3" stroke-linecap="round" />

  <circle cx="400" cy="330" r="9" fill="url(#brassGrad2)" />
  <circle cx="400" cy="330" r="3.5" fill="#303036" />

  <text x="400" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#2d2a26">RAW BRUSHED ALUMINIUM · SPECIAL EDITION</text>
