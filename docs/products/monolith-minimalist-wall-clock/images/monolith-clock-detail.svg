<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="rawDialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e8ea" />
      <stop offset="70%" stop-color="#c8c8cc" />
      <stop offset="100%" stop-color="#9a9aa0" />
    </radialGradient>
    <linearGradient id="brassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb782" />
      <stop offset="50%" stop-color="#b88f5f" />
      <stop offset="100%" stop-color="#8a6332" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8f7f4" />
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#f1eee7" stroke="#e3ded4" stroke-width="1" />

  <text x="400" y="90" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="14" letter-spacing="4" fill="#8c827a">TAVISTRA ATELIER · ARCHITECTURAL HOROLOGY</text>

