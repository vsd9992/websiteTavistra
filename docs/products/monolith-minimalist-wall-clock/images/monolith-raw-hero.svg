<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="rawHeroGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f0f4" />
      <stop offset="60%" stop-color="#d4d4dc" />
      <stop offset="100%" stop-color="#a6a6b2" />
    </radialGradient>
    <linearGradient id="brassGradRaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb782" />
      <stop offset="50%" stop-color="#b88f5f" />
      <stop offset="100%" stop-color="#8a6332" />
    </linearGradient>
    <filter id="shadowRaw" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8f7f4" />
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#f1eee7" stroke="#e3ded4" stroke-width="1" />

  <text x="400" y="90" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="14" letter-spacing="4" fill="#8c827a">TAVISTRA ATELIER · SPECIAL RAW EDITION</text>

  <g filter="url(#shadowRaw)">
    <circle cx="400" cy="330" r="180" fill="url(#rawHeroGrad)" stroke="#b0b0bc" stroke-width="4" />
    <circle cx="400" cy="330" r="172" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" />
    <circle cx="400" cy="330" r="160" fill="#e2e2e8" />
  </g>

  <!-- Pips -->
  <circle cx="400" cy="190" r="2.5" fill="url(#brassGradRaw)" />
  <circle cx="540" cy="330" r="2.5" fill="url(#brassGradRaw)" />
  <circle cx="400" cy="470" r="2.5" fill="url(#brassGradRaw)" />
  <circle cx="260" cy="330" r="2.5" fill="url(#brassGradRaw)" />

  <!-- Hands -->
  <line x1="400" y1="330" x2="400" y2="245" stroke="url(#brassGradRaw)" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="330" x2="480" y2="350" stroke="url(#brassGradRaw)" stroke-width="3" stroke-linecap="round" />

  <circle cx="400" cy="330" r="9" fill="url(#brassGradRaw)" />
  <circle cx="400" cy="330" r="3.5" fill="#383840" />

  <text x="400" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#2d2a26">RAW BRUSHED ALUMINIUM · HERO VIEW</text>
</svg>

