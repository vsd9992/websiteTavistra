<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="70%" stop-color="#1c1c20" />
      <stop offset="100%" stop-color="#141416" />
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5be8a" />
      <stop offset="50%" stop-color="#c59b6d" />
      <stop offset="100%" stop-color="#936d3e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="#f8f7f4" />
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#f1eee7" stroke="#e3ded4" stroke-width="1" />

  <!-- Studio Mark -->
  <text x="400" y="90" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="14" letter-spacing="4" fill="#8c827a">TAVISTRA ATELIER · ARCHITECTURAL HOROLOGY</text>

  <!-- Clock Outer Rim & Bevel -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="330" r="180" fill="url(#dialGrad)" stroke="#383840" stroke-width="4" />
    <circle cx="400" cy="330" r="172" fill="none" stroke="url(#brassGrad)" stroke-width="1.5" opacity="0.4" />
    <circle cx="400" cy="330" r="160" fill="#18181c" />
  </g>

  <!-- Radial Hour Markers (Subtle debossed pips) -->
  <circle cx="400" cy="190" r="2.5" fill="url(#brassGrad)" />
  <circle cx="540" cy="330" r="2.5" fill="url(#brassGrad)" />
  <circle cx="400" cy="470" r="2.5" fill="url(#brassGrad)" />
  <circle cx="260" cy="330" r="2.5" fill="url(#brassGrad)" />

  <!-- Hour Hand -->
  <line x1="400" y1="330" x2="400" y2="245" stroke="url(#brassGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Minute Hand -->
  <line x1="400" y1="330" x2="495" y2="330" stroke="url(#brassGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Centre Cap -->
  <circle cx="400" cy="330" r="9" fill="url(#brassGrad)" />
  <circle cx="400" cy="330" r="3.5" fill="#141416" />

  <text x="400" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#2d2a26">MONOLITH WALL CLOCK · MATTE OBSIDIAN</text>
</svg>
