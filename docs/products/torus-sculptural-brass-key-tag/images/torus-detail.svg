      <stop offset="0%" stop-color="#141211"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="smokedPatina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5B45"/>
