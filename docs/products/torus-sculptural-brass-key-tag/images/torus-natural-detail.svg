<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#070606"/>
    </linearGradient>
    <linearGradient id="brassKnurl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8BC"/>
      <stop offset="50%" stop-color="#C59B56"/>
      <stop offset="100%" stop-color="#7C591F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgTD)"/>

  <!-- Macro Barrel Closure & Titanium Wire Joint -->
  <g transform="translate(200, 140)">
    <rect x="0" y="80" width="400" height="120" rx="20" fill="#24211D" stroke="url(#brassKnurl)" stroke-width="6"/>
    <!-- Knurling texture lines -->
    <line x1="80" y1="86" x2="80" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="120" y1="86" x2="120" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="160" y1="86" x2="160" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="200" y1="86" x2="200" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="240" y1="86" x2="240" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="280" y1="86" x2="280" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>
    <line x1="320" y1="86" x2="320" y2="194" stroke="#FFE8BC" stroke-width="4" opacity="0.7"/>

    <!-- Titanium Wire Loop coming out of barrel -->
    <path d="M 0,140 C -80,140 -80,-40 200,-40 C 480,-40 480,140 400,140" fill="none" stroke="#A8A49C" stroke-width="12" stroke-linecap="round"/>
  </g>

  <text x="400" y="525" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#C59B56" letter-spacing="4">TORUS · THREADED KNURLED CLOSURE DETAIL</text>
</svg>

