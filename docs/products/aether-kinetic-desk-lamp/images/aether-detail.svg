<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#080707"/>
    </linearGradient>
    <linearGradient id="solidBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7"/>
      <stop offset="50%" stop-color="#C59B56"/>
      <stop offset="100%" stop-color="#7C5921"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgL2)"/>
  
  <!-- Counterweight & Rotational Bearing Pivot Close-up -->
  <g transform="translate(240, 140)">
    <circle cx="160" cy="160" r="120" fill="url(#solidBrass)" stroke="#FFE8BD" stroke-width="3"/>
    <circle cx="160" cy="160" r="70" fill="#24211D" stroke="url(#solidBrass)" stroke-width="8"/>
    <circle cx="160" cy="160" r="25" fill="#FFE8BD"/>
    <!-- Knurling Texture Indicators -->
    <line x1="160" y1="20" x2="160" y2="40" stroke="#7C5921" stroke-width="3"/>
    <line x1="160" y1="280" x2="160" y2="300" stroke="#7C5921" stroke-width="3"/>
    <line x1="20" y1="160" x2="40" y2="160" stroke="#7C5921" stroke-width="3"/>
    <line x1="280" y1="160" x2="300" y2="160" stroke="#7C5921" stroke-width="3"/>
  </g>
  
  <text x="400" y="490" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#C59B56" letter-spacing="4">PRECISION BEARING PIVOT &amp; DIMMER</text>
  <text x="400" y="512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7D756D" letter-spacing="2">ZERO-BACKLASH FLUID COUNTERBALANCE</text>
</svg>

