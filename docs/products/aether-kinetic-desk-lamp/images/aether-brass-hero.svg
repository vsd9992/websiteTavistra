<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <linearGradient id="brassSolidAll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE6BD"/>
      <stop offset="50%" stop-color="#C59B56"/>
      <stop offset="100%" stop-color="#734F18"/>
    </linearGradient>
    <linearGradient id="glowWarmB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgAB)"/>

  <!-- Full Monolithic Brass Lamp Schematic -->
  <g transform="translate(160, 100)">
    <ellipse cx="140" cy="400" rx="90" ry="24" fill="url(#brassSolidAll)" stroke="#FFE6BD" stroke-width="2"/>
    <rect x="130" y="380" width="20" height="20" fill="url(#brassSolidAll)"/>
    <line x1="140" y1="380" x2="220" y2="180" stroke="url(#brassSolidAll)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="220" cy="180" r="18" fill="url(#brassSolidAll)"/>
    <circle cx="220" cy="180" r="6" fill="#141312"/>
    <line x1="160" y1="210" x2="440" y2="120" stroke="url(#brassSolidAll)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="160" cy="210" r="26" fill="url(#brassSolidAll)"/>

    <g transform="translate(440, 120)">
      <polygon points="0,0 60,-15 70,25 0,10" fill="url(#brassSolidAll)"/>
      <polygon points="20,10 200,320 0,320" fill="url(#glowWarmB)"/>
    </g>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#C59B56" letter-spacing="4">TAVISTRA · AETHER LAMP (MONOLITHIC BRASS EDITION)</text>
</svg>

