<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716"/>
      <stop offset="100%" stop-color="#0F0E0D"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3835"/>
      <stop offset="100%" stop-color="#22201D"/>
    </linearGradient>
    <linearGradient id="bronzeChan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B56"/>
      <stop offset="50%" stop-color="#8E6A2F"/>
      <stop offset="100%" stop-color="#C59B56"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgS)"/>
  
  <!-- Desk Organiser Isometric Block -->
  <g transform="translate(180, 160)">
    <!-- Base Tray Shadow -->
    <rect x="20" y="30" width="440" height="220" rx="16" fill="#000000" opacity="0.5" filter="blur(12px)"/>
    <!-- Cast Stone Base -->
    <rect x="0" y="0" width="440" height="220" rx="16" fill="url(#stoneDark)" stroke="#4A4742" stroke-width="2"/>
    <!-- Pen Channel 1 (Bronze Inlay) -->
    <rect x="40" y="35" width="360" height="24" rx="8" fill="url(#bronzeChan)"/>
    <!-- Pen Channel 2 -->
    <rect x="40" y="75" width="220" height="24" rx="8" fill="url(#bronzeChan)"/>
    <!-- Phone / Notepad Recessed Tray -->
    <rect x="40" y="120" width="360" height="70" rx="10" fill="#1C1B19" stroke="#33302B" stroke-width="1.5"/>
    <text x="55" y="160" font-family="sans-serif" font-size="10" fill="#7D756D" letter-spacing="1">NATURAL MERINO FELT INLAY</text>
  </g>
  
  <text x="400" y="475" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#C59B56" letter-spacing="4">TAVISTRA · STRATA DESK ORGANISER</text>
  <text x="400" y="497" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7D756D" letter-spacing="2">CAST MINERAL STONE &amp; ANODISED BRONZE</text>
</svg>

