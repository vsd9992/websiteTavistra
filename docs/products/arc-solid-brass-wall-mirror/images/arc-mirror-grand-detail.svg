<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#060605"/>
    </linearGradient>
    <linearGradient id="brassZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED4A8"/>
      <stop offset="50%" stop-color="#C59B56"/>
      <stop offset="100%" stop-color="#704D1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGD)"/>

  <!-- Grand Mirror Heavy Z-Bar Cleat Mounting Joint -->
  <g transform="translate(160, 110)">
    <rect x="0" y="0" width="480" height="360" rx="20" fill="#1A1816" stroke="url(#brassZ)" stroke-width="20"/>
    <!-- Heavy Cleat Schematic -->
    <rect x="60" y="80" width="360" height="40" rx="8" fill="#3D3A35" stroke="#C59B56" stroke-width="2"/>
    <text x="80" y="105" font-family="sans-serif" font-size="11" fill="#FFE8BF" letter-spacing="2">HEAVY-DUTY INTERLOCKING Z-BAR CLEAT</text>
    <circle cx="90" cy="180" r="12" fill="url(#brassZ)"/>
    <circle cx="390" cy="180" r="12" fill="url(#brassZ)"/>
  </g>

  <text x="400" y="525" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" fill="#C59B56" letter-spacing="3">GRAND EDITION · STRUCTURAL CLEAT &amp; SOLID CHANNEL</text>
</svg>

