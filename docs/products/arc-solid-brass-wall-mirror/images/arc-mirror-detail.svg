<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="brass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7"/>
      <stop offset="40%" stop-color="#C59B56"/>
      <stop offset="100%" stop-color="#6F4F1D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Corner Joint Detail -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="500" height="380" rx="30" fill="#1C1A18" stroke="url(#brass2)" stroke-width="28"/>
    <!-- Mitred joint indicator -->
    <line x1="20" y1="20" x2="60" y2="60" stroke="#FFE7BA" stroke-width="2" opacity="0.4"/>
    <!-- Beveled glass edge -->
    <rect x="35" y="35" width="430" height="310" rx="15" fill="#24211D" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>
  </g>
  
  <text x="400" y="540" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" fill="#C59B56" letter-spacing="3">CORNER MITRE &amp; BEVELLED DETAIL</text>
  <text x="400" y="562" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#665F57" letter-spacing="2">SOLID ARCHITECTURAL BRASS FRAME</text>
</svg>

